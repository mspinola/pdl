# Build the site from the archive and publish it to GitHub Pages.
# Runs on every push to main that touches what the site is built from.
name: Publish site

on:
  push:
    branches: [main]
    paths: ["rules/**", "mfl_archive/**", "src/**", "site/**", "datasets/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # a push from the weekly refresh does not start other workflows, so run after it
  workflow_run:
    workflows: ["Weekly refresh"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # standard library only, so there is nothing to install
      - name: Check for owner names
        run: python3 src/check_no_owner_names.py
      - name: Check the archive
        run: python3 src/archive_mfl.py --verify
      - name: Build
        run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
