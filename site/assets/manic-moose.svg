<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t">
  <title id="t">The Manic Moose, America's Team, charging</title>
  <defs>
    <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2c18"/><stop offset=".6" stop-color="#2e1a0d"/><stop offset="1" stop-color="#1b0f07"/>
    </linearGradient>
    <radialGradient id="muscle" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#7a4f2e" stop-opacity=".9"/><stop offset="1" stop-color="#7a4f2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efdcb0"/><stop offset="1" stop-color="#b8935a"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ff2a1a"/><stop offset=".5" stop-color="#c00"/><stop offset="1" stop-color="#c00" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .hide{fill:url(#hide)}.leg{fill:#24140a}.legn{fill:#1a0e06}.hoof{fill:#0c0704}
    .mus{fill:url(#muscle)}.bone{fill:url(#bone);stroke:#2a1a0c;stroke-width:2.5;stroke-linejoin:round}
    .dust{fill:#a8865a;opacity:.4}.steam{fill:#fff;opacity:.8}
    .rig{animation:bob .4s ease-in-out infinite;transform-origin:240px 170px}
    .a{animation:legA .4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 4%}
    .b{animation:legB .4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 4%}
    .head{animation:nod .4s ease-in-out infinite;transform-origin:330px 130px}
    .dust{animation:puff .8s ease-out infinite;transform-box:fill-box;transform-origin:center}.d2{animation-delay:-.4s}
    .steam{animation:huff .8s ease-out infinite;transform-box:fill-box;transform-origin:left center}.st2{animation-delay:-.4s}
    .eye{animation:burn 1.2s ease-in-out infinite}
    @keyframes bob{50%{transform:translateY(-8px) rotate(-1.5deg)}}
    @keyframes legA{0%,100%{transform:rotate(30deg)}50%{transform:rotate(-26deg)}}
    @keyframes legB{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(30deg)}}
    @keyframes nod{50%{transform:rotate(5deg)}}
    @keyframes puff{0%{transform:scale(.3);opacity:.55}100%{transform:scale(1.8) translateX(-24px);opacity:0}}
    @keyframes huff{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.5) translate(16px,6px);opacity:0}}
    @keyframes burn{50%{opacity:.55}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <ellipse class="dust" cx="92" cy="282" rx="30" ry="13"/>
  <ellipse class="dust d2" cx="140" cy="290" rx="22" ry="10"/>

  <g class="rig">
    <!-- far legs -->
    <g class="b"><path class="legn" d="M128 168 L150 168 L146 232 L140 278 L130 278 L132 232Z"/><rect class="hoof" x="126" y="274" width="18" height="10" rx="3"/></g>
    <g class="a"><path class="legn" d="M296 160 L318 160 L314 228 L310 276 L300 276 L300 228Z"/><rect class="hoof" x="296" y="272" width="18" height="10" rx="3"/></g>

    <!-- body: low rump, massive shoulder hump -->
    <path class="hide" d="M112 150 Q108 118 140 108 Q190 96 232 98 Q262 70 300 76 Q336 82 344 118 Q350 160 326 186 Q290 202 230 198 Q170 200 132 188 Q110 176 112 150Z"/>
    <!-- muscle highlights: shoulder, haunch, ribs -->
    <ellipse class="mus" cx="300" cy="132" rx="48" ry="44"/>
    <ellipse class="mus" cx="150" cy="140" rx="42" ry="38"/>
    <path d="M218 150 Q232 168 226 186 M240 146 Q254 166 250 188" stroke="#160b05" stroke-width="3" fill="none" opacity=".5"/>
    <path d="M276 118 Q300 104 326 120" stroke="#8a5b35" stroke-width="3" fill="none" opacity=".6"/>
    <!-- mane along the hump -->
    <path d="M232 98 Q244 84 252 90 Q258 74 268 80 Q276 66 288 74 Q298 64 306 76" stroke="#120904" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- short tail -->
    <path class="hide" d="M114 134 Q98 130 100 116 Q110 124 118 124Z"/>

    <!-- near legs: thick forearm, knee, long cannon -->
    <g class="a"><path class="leg" d="M140 160 Q170 160 168 196 L162 236 L158 280 L146 280 L148 236 L140 196Z"/><rect class="hoof" x="142" y="276" width="20" height="11" rx="3"/></g>
    <g class="b"><path class="leg" d="M308 158 Q338 158 334 194 L328 234 L326 280 L314 280 L314 234 L306 194Z"/><rect class="hoof" x="310" y="276" width="20" height="11" rx="3"/></g>

    <!-- head: lowered, charging -->
    <g class="head">
      <!-- bell / dewlap -->
      <path class="hide" d="M354 168 Q362 200 350 220 Q342 202 344 172Z"/>
      <!-- heavy head with overhanging muzzle -->
      <path class="hide" d="M318 112 Q342 100 368 116 Q394 132 420 160 Q434 176 424 190 Q408 200 386 188 Q368 182 352 176 Q330 166 320 146Z"/>
      <ellipse class="mus" cx="356" cy="136" rx="26" ry="18"/>
      <!-- flared nostril and mouth -->
      <ellipse cx="420" cy="178" rx="7" ry="5" fill="#090503"/>
      <path d="M396 190 Q408 194 420 190" stroke="#090503" stroke-width="3" fill="none"/>
      <!-- ear, pinned back -->
      <path class="hide" d="M332 112 L306 96 L326 122Z"/>
      <!-- brow ridge over a red eye -->
      <circle class="eye" cx="360" cy="134" r="14" fill="url(#glow)"/>
      <ellipse cx="360" cy="134" rx="6" ry="4.5" fill="#ff3b22"/>
      <circle cx="361" cy="134" r="2" fill="#1a0000"/>
      <path d="M344 122 Q360 120 376 132" stroke="#0c0704" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- palmate antlers rooted on top of the skull, palm cupped upward -->
      <path class="bone" d="M334 112 Q324 100 312 96 Q300 90 296 78 Q304 82 308 80 Q302 72 304 62 Q310 70 316 70 Q314 60 320 52 Q324 62 330 64 Q332 56 340 50 Q340 62 344 68 Q338 84 336 98Z" opacity=".75"/>
      <path class="bone" d="M344 110 Q348 96 356 88 Q364 78 380 76 Q376 68 378 58 Q384 66 390 66 Q392 56 400 50 Q400 62 404 66 Q410 58 418 56 Q414 68 416 74 Q404 88 384 94 Q364 100 352 112Z"/>
      <!-- steam -->
      <ellipse class="steam" cx="438" cy="184" rx="11" ry="6"/>
      <ellipse class="steam st2" cx="436" cy="190" rx="8" ry="5"/>
    </g>
  </g>
</svg>
