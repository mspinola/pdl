<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-labelledby="t">
  <title id="t">The Manic Moose, America's Team, at full gallop</title>
  <style>
    .body{fill:#5a3a22}.dark{fill:#3b2414}.antler{fill:#d9b77a;stroke:#3b2414;stroke-width:3;stroke-linejoin:round}
    .eye{fill:#fff}.pupil{fill:#111}.hoof{fill:#1c120a}.speed{stroke:#c9a46a;stroke-width:5;stroke-linecap:round;opacity:.7}
    .dust{fill:#c9a46a;opacity:.45}.steam{fill:#fff;opacity:.85}.flag{fill:#b22234}.star{fill:#fff}
    .rig{animation:bob .36s ease-in-out infinite;transform-origin:210px 150px}
    .legF{animation:legA .36s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
    .legB{animation:legB .36s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
    .head{animation:nod .36s ease-in-out infinite;transform-origin:300px 110px}
    .speed{animation:zip .36s linear infinite}.s2{animation-delay:-.12s}.s3{animation-delay:-.24s}
    .dust{animation:puff .72s ease-out infinite;transform-box:fill-box;transform-origin:center}.d2{animation-delay:-.36s}
    .steam{animation:huff .72s ease-out infinite;transform-box:fill-box;transform-origin:left center}
    .pupil{animation:dart 1.4s steps(1) infinite}
    @keyframes bob{50%{transform:translateY(-9px) rotate(-2deg)}}
    @keyframes legA{0%,100%{transform:rotate(38deg)}50%{transform:rotate(-32deg)}}
    @keyframes legB{0%,100%{transform:rotate(-32deg)}50%{transform:rotate(38deg)}}
    @keyframes nod{50%{transform:rotate(6deg)}}
    @keyframes zip{0%{transform:translateX(30px);opacity:0}30%{opacity:.8}100%{transform:translateX(-60px);opacity:0}}
    @keyframes puff{0%{transform:scale(.3);opacity:.6}100%{transform:scale(1.6) translateX(-20px);opacity:0}}
    @keyframes huff{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.4) translateX(14px);opacity:0}}
    @keyframes dart{0%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <!-- speed lines and dust -->
  <line class="speed" x1="20" y1="110" x2="80" y2="110"/>
  <line class="speed s2" x1="10" y1="150" x2="85" y2="150"/>
  <line class="speed s3" x1="30" y1="190" x2="80" y2="190"/>
  <ellipse class="dust" cx="95" cy="238" rx="24" ry="12"/>
  <ellipse class="dust d2" cx="130" cy="244" rx="18" ry="9"/>

  <g class="rig">
    <!-- back legs -->
    <g class="legB"><rect class="dark" x="120" y="170" width="18" height="62" rx="8"/><rect class="hoof" x="118" y="226" width="22" height="12" rx="4"/></g>
    <g class="legF"><rect class="body" x="142" y="172" width="18" height="62" rx="8"/><rect class="hoof" x="140" y="228" width="22" height="12" rx="4"/></g>
    <!-- front legs -->
    <g class="legF"><rect class="dark" x="245" y="168" width="18" height="64" rx="8"/><rect class="hoof" x="243" y="226" width="22" height="12" rx="4"/></g>
    <g class="legB"><rect class="body" x="266" y="170" width="18" height="64" rx="8"/><rect class="hoof" x="264" y="228" width="22" height="12" rx="4"/></g>

    <!-- body, hump, tail -->
    <path class="body" d="M118 140 Q112 108 150 102 Q190 84 236 92 Q268 86 286 112 Q298 150 270 180 Q200 196 140 184 Q114 172 118 140Z"/>
    <path class="dark" d="M200 92 Q232 70 268 96 Q240 92 214 100Z"/>
    <path class="dark" d="M118 132 Q100 126 102 112 Q112 122 122 120Z"/>
    <!-- stars and stripes saddle cloth: America's Team -->
    <path class="flag" d="M168 106 L222 100 L226 150 L172 156Z"/>
    <path class="star" d="M184 112 l3 7 7 0-6 4 2 7-6-4-6 4 2-7-6-4 7 0z"/>
    <path d="M176 136 L224 131 M178 146 L225 141" stroke="#fff" stroke-width="5"/>

    <!-- head -->
    <g class="head">
      <path class="body" d="M270 110 Q290 92 318 98 Q348 104 372 124 Q382 136 368 144 Q340 150 316 138 Q296 140 282 132Z"/>
      <path class="dark" d="M290 136 Q298 162 288 176 Q280 160 284 138Z"/>
      <ellipse class="dark" cx="368" cy="134" rx="7" ry="5"/>
      <!-- manic eye -->
      <circle class="eye" cx="326" cy="110" r="9"/>
      <circle class="pupil" cx="328" cy="109" r="4.5"/>
      <path d="M314 98 L338 104" stroke="#1c120a" stroke-width="5" stroke-linecap="round"/>
      <!-- ear -->
      <path class="dark" d="M300 98 L292 80 L310 94Z"/>
      <!-- antlers, palmate -->
      <path class="antler" d="M296 96 Q270 70 252 52 Q262 66 258 74 Q248 64 236 58 Q246 72 244 82 Q232 74 224 72 Q244 92 280 100Z"/>
      <path class="antler" d="M312 94 Q326 62 352 44 Q348 60 356 66 Q362 54 376 46 Q370 62 376 72 Q386 64 396 64 Q370 92 322 100Z"/>
      <!-- steam from the nostril -->
      <ellipse class="steam" cx="386" cy="138" rx="10" ry="6"/>
    </g>
  </g>
</svg>
